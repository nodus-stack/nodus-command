version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: noduscm-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - noduscm

  apache:
    image: php:8.1-apache
    container_name: {{PROJECT_SLUG}}-apache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - mysql
    volumes:
      - ./wordpress:/var/www/html:z
      - ./wp-content:/var/www/html/wp-content:z
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf:z
{{APACHE_HTTPS_CERT_VOLUME}}
{{PHP_INI_VOLUME}}
{{APACHE_EXTRA_VOLUMES}}
    environment:
      - WORDPRESS_DB_HOST={{DB_HOST}}
      - WORDPRESS_DB_NAME={{DB_NAME}}
      - WORDPRESS_DB_USER={{DB_USER}}
      - WORDPRESS_DB_PASSWORD={{DB_PASSWORD}}
{{APACHE_EXTRA_ENV}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{PROJECT_SLUG}}.rule=Host(`{{DOMAIN}}`)"
      - "traefik.http.services.{{PROJECT_SLUG}}.loadbalancer.server.port=80"
    networks:
      - noduscm

  mysql:
    image: mysql:8.0
    container_name: {{PROJECT_SLUG}}-mysql
    environment:
      - MYSQL_ROOT_PASSWORD={{MYSQL_ROOT_PASSWORD}}
      - MYSQL_DATABASE={{DB_NAME}}
      - MYSQL_USER={{DB_USER}}
      - MYSQL_PASSWORD={{DB_PASSWORD}}
    ports:
{{MYSQL_PORT_BINDING}}  # Exponer el puerto para conexiones externas
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - noduscm

volumes:
  mysql_data:

networks:
  noduscm:
    external: true
